site_name: Agentmux
site_url: https://pagel-s.github.io/agentmux/
repo_url: https://github.com/pagel-s/agentmux/
repo_name: pagel-s/agentmux

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Your first checked result: getting-started/first-result.md
      - Visual workflow guide: visual-guide.md
      - Quickstart: getting-started/quickstart.md
      - Everyday commands: getting-started/everyday-commands.md
      - Terminal folders and layouts: terminal-workflow.md
  - Tutorials:
      - Legacy Layout Handoff: tutorials/hello-team.md
      - Portable Bundles: tutorials/portable-bundles.md
  - Coding Workflows:
      - Work on a Task: working.md
      - Advanced Workflows: workflows.md
      - Validation and Boundaries: workflow-validation.md
  - Core Concepts:
      - Layout Compiler (v1): architecture/mental-model.md
      - Pane Coordination (v1): architecture/coordination.md
  - Managed Teams:
      - Work Sessions: work-sessions.md
      - Control Center: usability-control-center.md
      - Native Collaboration: native-delivery.md
      - Runtime: managed-runtime.md
      - Setup: managed-setup.md
      - Persistent Workflows: autonomous-workflows.md
      - Autonomous Wakeup Policies: autonomy.md
      - Antigravity Bridge: antigravity-bridge.md
      - Hardening: hardening.md
      - Trust Boundaries: security-model.md
      - Memory: memory-lifecycle.md
      - Live Permissions: live-permissions.md
      - Dynamic Teams: dynamic-teams.md
      - Traces and Recovery: traces-and-recovery.md
      - SSH and Scale: remote-workers.md
      - Research: research.md
      - Pilot Runner: experiments.md
      - Controlled Studies: research-study.md
      - Provider Compatibility: provider-compatibility.md
      - Mixed Harness Scenario: mixed-harness-acceptance.md
      - Environments: research-environments.md
  - Reference:
      - Quality and Evidence: quality.md
      - Workflow Evaluation: evaluation.md
      - Release Validation: releasing.md
      - Layout Configuration (v1): config-guide.md
      - Pane Harnesses (v1): harnesses.md
      - CLI Commands: commands.md
      - Recipes: recipes.md
      - Pane Runtime (v1): runtime.md
