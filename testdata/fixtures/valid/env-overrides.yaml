version: 1
session: env-overrides

params:
  project_dir: "."

env:
  PROJECT_DIR: "{{project_dir}}"

agents:
  reviewer:
    provider: command
    command: "review"
    cwd: "{{project_dir}}"
    env:
      MODEL: "gpt-5"

layout:
  - window: review
    root: "{{project_dir}}"
    panes:
      - agent: reviewer
        env:
          MODEL: "gpt-5-mini"
