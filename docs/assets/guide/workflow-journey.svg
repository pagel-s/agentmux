<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title description">
  <title id="title">A checked coding request with explicit application</title>
  <desc id="description">Preview starts no models and creates no run files. Execution requires allow-models and retains a private worktree. Five phases implement and check, review in a fresh session, address findings and check, review the final revision in another fresh session, and run final checks. Inspect the report and patch before explicitly applying. Apply rechecks source freshness and never commits or pushes. Private storage is separate from optional Linux Bubblewrap process, filesystem and network isolation.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#69518c"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #221b31; }
      .heading { font-size: 25px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 14px; }
      .muted { fill: #574b68; }
      .card { fill: #ffffff; stroke: #c5b8dc; stroke-width: 1.5; }
      .phase .label { font-size: 16px; }
      .phase .body { font-size: 14px; }
      .arrow { fill: none; stroke: #69518c; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="580" rx="14" fill="#faf8ff"/>
  <text x="30" y="43" class="heading">Ask → execute → inspect → explicitly apply</text>
  <text x="30" y="73" class="body muted">amx work · one Git project · retained evidence · finite attempts and deadline</text>

  <g transform="translate(30 104)">
    <rect class="card" width="210" height="115" rx="10"/>
    <text x="16" y="30" class="label">1. Preview</text>
    <text x="16" y="57" class="body">Task, profiles and check</text>
    <text x="16" y="79" class="body">No model calls</text>
    <text x="16" y="101" class="body">No run files</text>
  </g>
  <path d="M245 161 H265" class="arrow"/>
  <g transform="translate(275 104)">
    <rect class="card" width="210" height="115" rx="10"/>
    <text x="16" y="30" class="label">2. Execute</text>
    <text x="16" y="57" class="body">Add --allow-models</text>
    <text x="16" y="79" class="body">Private Git worktree</text>
    <text x="16" y="101" class="body">Five execution phases</text>
  </g>
  <path d="M490 161 H510" class="arrow"/>
  <g transform="translate(520 104)">
    <rect class="card" width="210" height="115" rx="10"/>
    <text x="16" y="30" class="label">3. Inspect</text>
    <text x="16" y="57" class="body">work status / show latest</text>
    <text x="16" y="79" class="body">Inspect report + patch</text>
    <text x="16" y="101" class="body">Check failures and limits</text>
  </g>
  <path d="M735 161 H755" class="arrow"/>
  <g transform="translate(765 104)">
    <rect width="205" height="115" rx="10" fill="#eef8f2" stroke="#78a68c" stroke-width="1.5"/>
    <text x="16" y="30" class="label" style="font-size:17px">4. Apply deliberately</text>
    <text x="16" y="57" class="body">work apply latest</text>
    <text x="16" y="79" class="body">Recheck fresh content</text>
    <text x="16" y="101" class="body">No commit or push</text>
  </g>

  <path d="M380 221 V253" class="arrow"/>
  <rect x="30" y="265" width="940" height="191" rx="12" fill="#f0eafb" stroke="#c5b8dc"/>
  <text x="48" y="295" class="label">Retained run · source integration stays separate</text>
  <g class="phase" transform="translate(48 316)">
    <rect class="card" width="165" height="104" rx="8"/>
    <text x="14" y="28" class="label">Implement</text>
    <text x="14" y="54" class="body">Codex by default</text>
    <text x="14" y="79" class="body">+ declared checks</text>
  </g>
  <path d="M216 368 H229" class="arrow"/>
  <g class="phase" transform="translate(233 316)">
    <rect class="card" width="165" height="104" rx="8"/>
    <text x="14" y="28" class="label">Fresh review</text>
    <text x="14" y="54" class="body">Task + criteria</text>
    <text x="14" y="79" class="body">+ current files</text>
  </g>
  <path d="M401 368 H414" class="arrow"/>
  <g class="phase" transform="translate(418 316)">
    <rect class="card" width="165" height="104" rx="8"/>
    <text x="14" y="28" class="label">Address findings</text>
    <text x="14" y="54" class="body">Bounded correction</text>
    <text x="14" y="79" class="body">+ declared checks</text>
  </g>
  <path d="M586 368 H599" class="arrow"/>
  <g class="phase" transform="translate(603 316)">
    <rect class="card" width="165" height="104" rx="8"/>
    <text x="14" y="28" class="label">Final review</text>
    <text x="14" y="54" class="body">Fresh session</text>
    <text x="14" y="79" class="body">Explicit approval</text>
  </g>
  <path d="M771 368 H784" class="arrow"/>
  <g class="phase" transform="translate(788 316)">
    <rect class="card" width="164" height="104" rx="8"/>
    <text x="14" y="28" class="label">Final checks</text>
    <text x="14" y="54" class="body">Revision-bound result</text>
    <text x="14" y="79" class="body">Retain patch + report</text>
  </g>
  <text x="48" y="444" class="small muted">Failed checks, missing approval or uncertain turns remain evidence; they do not authorize application.</text>

  <text x="30" y="493" class="body">Private Git storage separates evidence. Default local tools still have trusted host authority.</text>
  <text x="30" y="522" class="body">Optional Linux Bubblewrap adds required filesystem, PID and network boundaries; unavailable isolation fails closed.</text>
  <text x="30" y="551" class="small muted">Keep reports private. Inspect interrupted work before retrying; recover resolves apply history without replaying a patch.</text>
</svg>
