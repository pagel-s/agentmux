name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Ensure terminal and sandbox dependencies are available
        run: |
          if ! command -v tmux >/dev/null 2>&1 || ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tmux bubblewrap
          fi

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Build the CLI for lifecycle tests
        run: go build -o bin/agentmux ./cmd/agentmux

      - name: Run test suite
        env:
          AGENTMUX_MANAGED_INTEGRATION: '1'
          AGENTMUX_EXPERIMENT_INTEGRATION: '1'
        run: go test -race -count=1 ./...

      - name: Verify release installer safety
        run: python3 scripts/test-install-release.py

      - name: Verify soak audit and cleanup regressions
        run: python3 scripts/test-soak-managed.py

      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: v2.19.0
          args: check

  sandbox:
    # Keep isolation checks explicit and fail closed. A runner that cannot
    # establish the boundary must fail this job, rather than skip every check.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install model-free test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux bubblewrap python3

      - name: Require working isolation
        run: bwrap --unshare-all --die-with-parent --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --ro-bind /lib64 /lib64 --proc /proc --dev /dev -- /usr/bin/true

      - name: Verify sandbox, network, disk and team boundaries
        run: make test-sandbox

      - name: Verify isolated research and resume
        run: make test-research

      - name: Verify crash recovery and trace continuity
        run: make test-soak
