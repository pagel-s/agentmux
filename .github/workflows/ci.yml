name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Ensure terminal and sandbox dependencies are available
        run: |
          if ! command -v tmux >/dev/null 2>&1 || ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tmux bubblewrap
          fi

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Verify third-party notice failure controls
        run: python3 scripts/test-third-party-notices.py

      - name: Verify comparison harness failure controls without model calls
        run: |
          python3 scripts/test-compare-workflows.py
          python3 scripts/test-subscription-pilot.py

      - name: Verify owner console interaction regressions
        run: node --test cmd/agentmux/workweb/app.test.cjs

      - name: Build the CLI for lifecycle tests
        run: |
          go build -o bin/amx ./cmd/agentmux
          ln -sfn amx bin/agentmux

      - name: Verify operational and comparison evidence summaries without providers
        env:
          AGENTMUX_INTEGRATION_BINARY: '${{ github.workspace }}/bin/amx'
        run: |
          python3 scripts/test-summarize-observations.py
          python3 scripts/test-summarize-comparison.py

      - name: Run test suite
        env:
          AGENTMUX_MANAGED_INTEGRATION: '1'
          AGENTMUX_EXPERIMENT_INTEGRATION: '1'
          AGENTMUX_TMUX_DEBUG: '1'
          AGENTMUX_KEEP_UAT_ARTIFACTS: '1'
        run: go test -race -count=1 -timeout=20m ./...

      - name: Verify workflow CLI journeys without provider calls
        run: python3 scripts/validate-workflows.py --binary bin/amx --output "$RUNNER_TEMP/agentmux-workflow-validation"

      - name: Verify guided work journey with protocol fixtures
        run: python3 scripts/validate-workflows.py --binary bin/amx --output "$RUNNER_TEMP/agentmux-guided-validation" --guided

      - name: Verify explicit legacy shared-storage compatibility
        run: python3 scripts/validate-workflows.py --binary bin/amx --output "$RUNNER_TEMP/agentmux-shared-validation" --storage shared

      - name: Verify workflow acceptance evidence cannot report false success
        run: |
          python3 scripts/test-validate-workflows.py
          python3 scripts/test-workflow-review-evidence.py

      - name: Verify workflow soak admission, audit and cleanup safety
        run: python3 scripts/test-soak-workflows.py

      - name: Preserve failed model-free workflow acceptance evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: model-free-workflow-acceptance-failure-evidence
          path: |
            ${{ runner.temp }}/agentmux-workflow-validation
            ${{ runner.temp }}/agentmux-guided-validation
            ${{ runner.temp }}/agentmux-shared-validation
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Fuzz the workflow configuration boundary
        run: go test ./internal/workflow -run '^$' -fuzz '^FuzzWorkflowPlanRoundTrip$' -fuzztime=20s -parallel=2

      - name: Preserve failed tmux client-view diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tmux-test-failure-logs
          path: /tmp/amx-views-*/tmux-*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Preserve failed terminal navigation captures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: terminal-navigation-failure-evidence
          path: |
            /tmp/amx-session-navigation-*/failure.txt
            /tmp/amx-session-navigation-*/connections-*.txt
            /tmp/amx-session-navigation-*/switcher-*.txt
            /tmp/amx-session-navigation-*/result.json
            /tmp/amx-session-navigation-*/key-stages.txt
            /tmp/amx-session-navigation-*/tmux-metadata.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify release installer safety
        run: python3 scripts/test-install-release.py

      - name: Verify release retry guards
        run: python3 scripts/test-check-release.py

      - name: Verify installed release and draft publication guards
        run: |
          python3 scripts/test-smoke-release.py
          python3 scripts/test-publish-release.py

      - name: Verify soak audit and cleanup regressions
        run: python3 scripts/test-soak-managed.py

      - name: Verify acceptance verifier failure reporting
        run: python3 scripts/test-managed-oracle.py

      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: v2.19.0
          args: check

  first-run:
    name: Installed first run (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Verify current distribution dependency notices
        run: python3 scripts/check-third-party-notices.py --check
      - name: Build actual distribution archives without publishing
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --clean
      - name: Install the host archive and complete the model-free journey
        run: |
          snapshot_version=$(python3 -c 'import json; print(json.load(open("dist/metadata.json"))["version"])')
          python3 scripts/smoke-release.py --artifact-dir dist --version "$snapshot_version" --output "$RUNNER_TEMP/agentmux-installed-first-run"
      - name: Preserve first-run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-first-run-${{ matrix.os }}
          path: ${{ runner.temp }}/agentmux-installed-first-run
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  sandbox:
    # Keep isolation checks explicit and fail closed. A runner that cannot
    # establish the boundary must fail this job, rather than skip every check.
    # Include real namespace/durability tests and the later mutation/soak stages.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Install model-free test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux python3 curl xz-utils build-essential meson ninja-build pkg-config libcap-dev libselinux1-dev

      - name: Build supported Bubblewrap in a private prefix
        # Jammy's 0.6.1 lacks --size. Verify the official source release and
        # preserve host security policy; never downgrade disk enforcement.
        env:
          AGENTMUX_BWRAP_VERSION: '0.13.1'
          AGENTMUX_BWRAP_SHA256: '0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d'
        run: |
          curl --fail --location --output "$RUNNER_TEMP/agentmux-bwrap.tar.xz" "https://github.com/containers/bubblewrap/releases/download/v${AGENTMUX_BWRAP_VERSION}/bubblewrap-${AGENTMUX_BWRAP_VERSION}.tar.xz"
          printf '%s  %s\n' "$AGENTMUX_BWRAP_SHA256" "$RUNNER_TEMP/agentmux-bwrap.tar.xz" | sha256sum --check --strict
          tar -xf "$RUNNER_TEMP/agentmux-bwrap.tar.xz" -C "$RUNNER_TEMP"
          meson setup "$RUNNER_TEMP/agentmux-bwrap-build" "$RUNNER_TEMP/bubblewrap-${AGENTMUX_BWRAP_VERSION}" --prefix "$RUNNER_TEMP/agentmux-bwrap" --wrap-mode=nodownload -Dman=disabled -Dtests=false -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$RUNNER_TEMP/agentmux-bwrap-build"
          meson install -C "$RUNNER_TEMP/agentmux-bwrap-build"
          echo "$RUNNER_TEMP/agentmux-bwrap/bin" >> "$GITHUB_PATH"

      - name: Require working isolation and capped tmpfs
        run: |
          bwrap --version
          bwrap --unshare-all --die-with-parent --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --ro-bind /lib64 /lib64 --size 1048576 --tmpfs /tmp --proc /proc --dev /dev -- /usr/bin/true

      - name: Verify acceptance oracle controls without model calls
        run: python3 scripts/smoke-managed-models.py --check-fixtures

      - name: Verify guided credential retention with actual isolation
        env:
          AGENTMUX_SANDBOX_INTEGRATION: '1'
          AGENTMUX_INTEGRATION_BINARY: '${{ github.workspace }}/bin/amx'
        run: |
          make build
          GOCACHE="$GITHUB_WORKSPACE/.cache/go-build" go test -race -count=1 -timeout=3m ./internal/workflow -run '^TestWorkflowIsolationRealGuidedCredentialsRemainUsable$'

      - name: Verify sandbox, network, disk and team boundaries
        env:
          AGENTMUX_TMUX_DEBUG: '1'
        run: make test-sandbox

      - name: Verify workflow oracle mutations and cleanup with actual isolation
        env:
          AGENTMUX_SANDBOX_INTEGRATION: '1'
          AGENTMUX_INTEGRATION_BINARY: '${{ github.workspace }}/bin/amx'
          AGENTMUX_WORKFLOW_TEST_EVIDENCE_ROOT: '${{ runner.temp }}/agentmux-workflow-regression-evidence'
        run: python3 scripts/test-soak-workflows.py

      - name: Verify guided workflow with required PID containment
        run: python3 scripts/validate-workflows.py --binary bin/amx --output "$RUNNER_TEMP/agentmux-guided-pid-validation" --guided --containment pid-namespace

      - name: Verify guided and advanced workflows with full isolation
        run: |
          python3 scripts/validate-workflows.py --binary bin/amx --output "$RUNNER_TEMP/agentmux-guided-full-validation" --guided --storage private --isolation bubblewrap
          python3 scripts/validate-workflows.py --binary bin/amx --output "$RUNNER_TEMP/agentmux-flow-full-validation" --storage private --isolation bubblewrap

      - name: Verify isolated workflow fault and recovery soak without providers
        run: python3 scripts/soak-workflows.py --binary bin/amx --output "$RUNNER_TEMP/agentmux-workflow-soak" --iterations 1 --duration-seconds 300 --containment pid-namespace --storage private --isolation bubblewrap

      - name: Preserve failed model-free workflow evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: model-free-workflow-failure-evidence
          path: |
            ${{ runner.temp }}/agentmux-guided-pid-validation
            ${{ runner.temp }}/agentmux-guided-full-validation
            ${{ runner.temp }}/agentmux-flow-full-validation
            ${{ runner.temp }}/agentmux-workflow-soak
            ${{ runner.temp }}/agentmux-workflow-regression-evidence
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Preserve failed sandbox tmux client-view diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tmux-sandbox-failure-logs
          path: /tmp/amx-views-*/tmux-*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Preserve failed interactive popup captures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interactive-popup-failure-evidence
          path: |
            /tmp/amx-interactive-failure-*/failed-popup-screen.bin
            /tmp/amx-interactive-failure-*/failure-context.json
            /tmp/amx-interactive-failure-*/lead-pane.txt
            /tmp/amx-interactive-failure-*/worker-pane.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify isolated research and resume
        run: make test-research

      - name: Verify crash recovery and trace continuity
        run: make test-soak
