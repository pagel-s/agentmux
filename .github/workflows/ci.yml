name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Ensure terminal and sandbox dependencies are available
        run: |
          if ! command -v tmux >/dev/null 2>&1 || ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tmux bubblewrap
          fi

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Build the CLI for lifecycle tests
        run: go build -o bin/agentmux ./cmd/agentmux

      - name: Run test suite
        env:
          AGENTMUX_MANAGED_INTEGRATION: '1'
          AGENTMUX_EXPERIMENT_INTEGRATION: '1'
        run: go test -race -count=1 ./...

      - name: Verify release installer safety
        run: python3 scripts/test-install-release.py

      - name: Verify soak audit and cleanup regressions
        run: python3 scripts/test-soak-managed.py

      - name: Verify acceptance verifier failure reporting
        run: python3 scripts/test-managed-oracle.py

      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: v2.19.0
          args: check

  sandbox:
    # Keep isolation checks explicit and fail closed. A runner that cannot
    # establish the boundary must fail this job, rather than skip every check.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install model-free test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux python3 curl xz-utils build-essential meson ninja-build pkg-config libcap-dev libselinux1-dev

      - name: Build supported Bubblewrap in a private prefix
        # Jammy's 0.6.1 lacks --size. Verify the official source release and
        # preserve host security policy; never downgrade disk enforcement.
        env:
          AGENTMUX_BWRAP_VERSION: '0.13.1'
          AGENTMUX_BWRAP_SHA256: '0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d'
        run: |
          curl --fail --location --output "$RUNNER_TEMP/agentmux-bwrap.tar.xz" "https://github.com/containers/bubblewrap/releases/download/v${AGENTMUX_BWRAP_VERSION}/bubblewrap-${AGENTMUX_BWRAP_VERSION}.tar.xz"
          printf '%s  %s\n' "$AGENTMUX_BWRAP_SHA256" "$RUNNER_TEMP/agentmux-bwrap.tar.xz" | sha256sum --check --strict
          tar -xf "$RUNNER_TEMP/agentmux-bwrap.tar.xz" -C "$RUNNER_TEMP"
          meson setup "$RUNNER_TEMP/agentmux-bwrap-build" "$RUNNER_TEMP/bubblewrap-${AGENTMUX_BWRAP_VERSION}" --prefix "$RUNNER_TEMP/agentmux-bwrap" --wrap-mode=nodownload -Dman=disabled -Dtests=false -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$RUNNER_TEMP/agentmux-bwrap-build"
          meson install -C "$RUNNER_TEMP/agentmux-bwrap-build"
          echo "$RUNNER_TEMP/agentmux-bwrap/bin" >> "$GITHUB_PATH"

      - name: Require working isolation and capped tmpfs
        run: |
          bwrap --version
          bwrap --unshare-all --die-with-parent --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --ro-bind /lib64 /lib64 --size 1048576 --tmpfs /tmp --proc /proc --dev /dev -- /usr/bin/true

      - name: Verify acceptance oracle controls without model calls
        run: python3 scripts/smoke-managed-models.py --check-fixtures

      - name: Verify sandbox, network, disk and team boundaries
        run: make test-sandbox

      - name: Verify isolated research and resume
        run: make test-research

      - name: Verify crash recovery and trace continuity
        run: make test-soak
