# .goreleaser.yaml
version: 2

project_name: agentmux

builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/agentmux
    binary: amx
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - CONTRIBUTING.md
      - SECURITY.md
      - docs/*.md
      - docs/*.json
      - docs/*.txt
      - docs/**/*
      - examples/*.yaml
      - examples/**/*
      - scripts/*.py
      - scripts/third-party-notice-sources.json
      - scripts/license-texts/*.txt
      - scripts/**/*.py
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

release:
  prerelease: auto
  header: |
    Simpler setup for native subscriptions, with checked work and visible outcomes.

    Start your normal native workspace, then use `amx pair A B --delivery auto`
    to preview task pairing. Add `--apply` to atomically grant mutual Commands,
    configure both receivers and enable returned results. Connections Shift+C
    offers the same configuration in one owner review. Existing eligible queues
    and all already-authorized senders are shown as part of the delivery scope;
    turn/hop limits, spent turns and unrelated permissions remain saved.

    Ordinary trusted-local `amx work` now selects installed native CLIs, preferring
    Codex for coding and Claude for fresh review when available. Previews name and
    pin both profiles without starting providers. Explicit and isolated profiles
    keep their selected authority. Implicit Codex/Claude turn limits follow the
    shared overall deadline up to the existing ten-minute ceiling, with budgets
    visible before execution. The short quickstart focuses on everyday use;
    detailed verification steps remain available separately.

    Workflow fixture tracking retires only kernel-confirmed exited identities,
    preserving live-process bounds and cleanup evidence during long Go checks.

    Agentmux is MIT licensed. Observation distinguishes worker check-ins, native
    events, delivery uncertainty and verified results; it does not infer hidden
    model activity. See the [observability guide](https://pagel-s.github.io/agentmux/observability/).

    The managed runtime and workbench remain experimental. Start with the
    [illustrated workflow guide](https://pagel-s.github.io/agentmux/visual-guide/)
    and [installation instructions](https://pagel-s.github.io/agentmux/getting-started/installation/).

    Strict worker isolation requires Linux with working Bubblewrap namespaces.
    Native/provider billing is not a hard-capped guarantee. See the bundled
    hardening, provider, remote-worker and research documentation for limits.

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
