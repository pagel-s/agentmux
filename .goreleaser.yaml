# .goreleaser.yaml
version: 2

project_name: agentmux

builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/agentmux
    binary: amx
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - CONTRIBUTING.md
      - SECURITY.md
      - docs/*.md
      - docs/*.json
      - docs/*.txt
      - docs/**/*
      - examples/*.yaml
      - examples/**/*
      - scripts/*.py
      - scripts/third-party-notice-sources.json
      - scripts/license-texts/*.txt
      - scripts/**/*.py
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

release:
  prerelease: auto
  header: |
    Checked coding workflows and controlled collaboration across native agents.

    Start with `amx demo`: a model-free first result in a private disposable
    repository. A clean initial review in `amx work` can skip redundant response
    and second-review turns only for the exact independently checked revision;
    final acceptance checks and explicit application remain mandatory. Requested
    changes keep the full loop, and skipped phases remain visible in evidence.

    `amx observe` now records fixed diagnostic codes and local collection timings.
    Offline operational and matched-comparison reports preserve unknown states,
    gaps, failed and incomplete attempts without inventing uptime or a winner.
    Connections adds direct sender/recipient focus with `[` and `]`, clear labels
    and independent selections. Exact-task inspection and reviewed recovery remain
    available through `amx task ID --open`.

    Agentmux is MIT licensed. Observation distinguishes worker check-ins, native
    events, delivery uncertainty and verified results; it does not infer hidden
    model activity. See the [observability guide](https://pagel-s.github.io/agentmux/observability/).

    The managed runtime and workbench remain experimental. Start with the
    [illustrated workflow guide](https://pagel-s.github.io/agentmux/visual-guide/)
    and [installation instructions](https://pagel-s.github.io/agentmux/getting-started/installation/).

    Strict worker isolation requires Linux with working Bubblewrap namespaces.
    Native/provider billing is not a hard-capped guarantee. See the bundled
    hardening, provider, remote-worker and research documentation for limits.

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
