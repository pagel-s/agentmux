<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" role="img" aria-labelledby="title description">
  <title id="title">Legacy output polling</title>
  <desc id="description">A planner prints PLAN_READY into its tmux buffer. A worker polls that buffer with amx wait and proceeds when the configured regular expression matches. A text match is not a verified task result.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#69518c"/></marker></defs>
  <rect width="840" height="210" rx="12" fill="#faf8ff"/>
  <g fill="#ffffff" stroke="#c5b8dc" stroke-width="1.5"><rect x="25" y="65" width="165" height="60" rx="8"/><rect x="245" y="65" width="165" height="60" rx="8"/><rect x="465" y="65" width="165" height="60" rx="8"/><rect x="685" y="65" width="130" height="60" rx="8"/></g>
  <g fill="none" stroke="#69518c" stroke-width="2" marker-end="url(#a)"><path d="M190 95H239"/><path d="M410 95H459"/><path d="M630 95H679"/></g>
  <g font-family="system-ui, sans-serif" font-size="17" fill="#221b31" text-anchor="middle"><text x="107" y="101">Planner pane</text><text x="327" y="101">Tmux buffer</text><text x="547" y="101">Worker: wait</text><text x="750" y="101">Proceed</text></g>
  <g font-family="system-ui, sans-serif" font-size="14" fill="#574b68" text-anchor="middle"><text x="217" y="47">Print</text><text x="437" y="47">Poll regex</text><text x="657" y="47">Match</text><text x="420" y="163">amx wait SESSION PANE REGEX</text><text x="420" y="190">A text match synchronizes panes; it does not verify the result.</text></g>
</svg>
