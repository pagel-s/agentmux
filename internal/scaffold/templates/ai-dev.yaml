# Original v1 layout mode. For the interactive workbench, use agentmux start.
version: 1
name: AI Dev Workspace
session: ai-dev
description: Multi-agent coding workspace

params:
  project_dir: "."

env:
  PROJECT_DIR: "{{project_dir}}"

agents:
  coder:
    # A native provider can deliver persona and pane-coordination context
    # provider: claude
    # persona: "PERSONA.md"
    provider: command
    command: "ollama run codellama"
    cwd: "{{project_dir}}"
    title: "Coder"

  reviewer:
    # Uses the installed Codex CLI and its selected model/authentication
    provider: codex
    cwd: "{{project_dir}}"
    title: "Reviewer"

layout:
  - window: editor
    root: "{{project_dir}}"
    layout: even-horizontal
    panes:
      - command: "nvim"
        title: "Editor"
        focus: true
      - agent: coder

  - window: validation
    root: "{{project_dir}}"
    layout: even-vertical
    panes:
      - command: "npm test --watch"
        title: "Tests"
      - agent: reviewer

hooks:
  pre_session: "test -d {{project_dir}}"
  post_session: "tmux display-message 'Agentmux ready'"
