version: 1
name: Review Loop
session: review-loop

params:
  project_dir: "."
  review_model: "gpt-5-mini"

env:
  PROJECT_DIR: "{{project_dir}}"

agents:
  coder:
    provider: command
    command: "ollama run codellama"
    cwd: "{{project_dir}}"
    title: "Coder"

  reviewer:
    provider: command
    command: "openai api chat.completions.create -m {{review_model}}"
    cwd: "{{project_dir}}"
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
    title: "Reviewer"

layout:
  - window: editor
    root: "{{project_dir}}"
    layout: main-vertical
    panes:
      - command: "nvim"
        title: "Editor"
        focus: true
      - agent: coder

  - window: review
    root: "{{project_dir}}"
    layout: even-vertical
    panes:
      - agent: reviewer
      - command: "git diff --stat && npm test"
        title: "Checks"
