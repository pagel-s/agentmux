# Original v1 layout mode. For the interactive workbench, use agentmux start.
version: 1
name: Review Loop
session: review-loop

params:
  project_dir: "."

env:
  PROJECT_DIR: "{{project_dir}}"

agents:
  coder:
    provider: command
    command: "ollama run codellama"
    cwd: "{{project_dir}}"
    title: "Coder"

  reviewer:
    provider: codex
    cwd: "{{project_dir}}"
    title: "Reviewer"

layout:
  - window: editor
    root: "{{project_dir}}"
    layout: main-vertical
    panes:
      - command: "nvim"
        title: "Editor"
        focus: true
      - agent: coder

  - window: review
    root: "{{project_dir}}"
    layout: even-vertical
    panes:
      - agent: reviewer
      - command: "git diff --stat && npm test"
        title: "Checks"
