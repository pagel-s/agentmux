version: 1
session: dogfood

params:
  project_dir: "."

env:
  PROJECT_DIR: "{{project_dir}}"

agents:
  reviewer:
    provider: command
    command: "printf 'review pane ready\n'"
    cwd: "{{project_dir}}"
    title: "Reviewer"

layout:
  - window: workspace
    root: "{{project_dir}}"
    layout: grid
    grid_rows: 2
    grid_columns: 2
    panes:
      - name: editor
        command: "nvim"
        title: "Editor"
      - name: tests
        command: "go test ./... -count=1"
        title: "Tests"
      - name: git
        command: "git status"
        title: "Git"
      - name: reviewer
        agent: reviewer

  - window: grid
    root: "{{project_dir}}"
    layout: grid
    grid_rows: 3
    grid_columns: 3
    panes:
      - name: pwd
        command: "pwd"
        title: "PWD"
      - name: status
        command: "git status --short"
        title: "Status"
      - name: branch
        command: "git branch --show-current"
        title: "Branch"
      - name: files
        command: "rg --files | head -20"
        title: "Files"
      - name: resolve
        command: "go test ./internal/resolve -count=1"
        title: "Resolve"
        focus: true
      - name: tmux
        command: "go test ./internal/tmux -count=1"
        title: "Tmux"
      - name: validate
        command: "go test ./internal/validate -count=1"
        title: "Validate"
      - name: build
        command: "make build"
        title: "Build"
      - name: review
        agent: reviewer
