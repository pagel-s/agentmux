version: 1
session: coding

params:
  project_dir: "/path/to/your/repo"

env:
  PROJECT_DIR: "{{project_dir}}"

agents:
  oder:
    provider: command
    command: "printf 'replace agents.coder.command with your coding command\\n'; exec $SHELL"
    cwd: "{{project_dir}}"
    title: "Coder"

layout:
  - window: workspace
    root: "{{project_dir}}"
    layout: grid
    grid_rows: 2
    grid_columns: 2
    panes:
      - name: editor
        command: "exec ${EDITOR:-vi}"
        title: "Editor"
        focus: true
      - name: checks
        command: "printf 'run your test or build command here\\n'; exec $SHELL"
        title: "Checks"
      - name: git
        command: "git status"
        title: "Git"
      - name: coder
        agent: coder
